# The two settings an author's app needs. Claude edits these; nothing else
# in the build has to change.
#
# applicationId: the app's permanent unique ID on phones and in the store.
#   Format: io.github.<github-username>.<appname> (lowercase letters, digits, dots).
#   Don't change it after the app has been shared: phones treat a new ID as a different app.
# appName: the name shown under the app's icon.
applicationId=io.github.wurp.avjournal
appName=AV Journal
